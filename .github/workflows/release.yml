name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        run: |
          tagVersion="${GITHUB_REF_NAME#v}"
          packageVersion="$(node -p "require('./package.json').version")"
          if [ "$tagVersion" != "$packageVersion" ]; then
            echo "Tag version $tagVersion does not match package.json version $packageVersion."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build Apple Silicon DMG
        run: npm run dist:mac:arm64 -- --publish never

      - name: Build Intel DMG
        run: npm run dist:mac:x64 -- --publish never

      - name: Verify architecture-specific DMGs
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f "dist/SimpleNote-${version}-arm64.dmg"
          test -f "dist/SimpleNote-${version}-x64.dmg"
          if find dist -maxdepth 1 -name '*-universal.dmg' -print -quit | grep -q .; then
            echo "Unexpected universal DMG found."
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            "dist/SimpleNote-${version}-arm64.dmg" \
            "dist/SimpleNote-${version}-x64.dmg" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
